# Local automation stack: n8n + Mailpit.
#   1. pnpm n8n:setup        → creates n8n.env (shared secret + Convex URL)
#   2. docker compose up -d  → n8n at http://localhost:5678, inbox at http://localhost:8025
#   3. pnpm tunnel           → public HTTPS URL so Convex (cloud) can reach n8n
# Stop with: docker compose down   (n8n data is kept in the n8n_data volume)
name: lendloop

services:
  n8n:
    image: n8nio/n8n:3.1.0 # pinned so everyone runs the same version
    ports:
      - "127.0.0.1:5678:5678" # this machine only; the tunnel reaches it locally
    # Non-secret settings only (LENDLOOP_CONVEX_URL, LENDLOOP_APP_URL). The HMAC
    # secret lives in an encrypted n8n Crypto credential, not in this environment.
    env_file: n8n.env
    environment:
      # Loan dates and "overdue" are UTC calendar days, so schedules run in UTC.
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      # Workflows read the two URLs above via {{ $env.… }}.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Data minimisation: execution logs contain recipient emails, so n8n
      # deletes them after 7 days (168 hours).
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:v1.31.2 # pinned like n8n
    ports:
      # Bound to this machine only: the inbox shows recipient emails.
      - "127.0.0.1:8025:8025" # inbox UI
      - "127.0.0.1:1025:1025" # SMTP; n8n sends to mailpit:1025 inside the network

volumes:
  n8n_data:
